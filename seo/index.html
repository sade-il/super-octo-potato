<!DOCTYPE html>
<!--
  תבנית index.html עם תגיות SEO תקינות עבור sade-il.com
  ===================================================================
  זהו ה-index.html הראשי של פרויקט Lovable / Vite.
  החליפו את הקובץ הקיים בפרויקט בקובץ הזה (או העתיקו ממנו את חלק ה-<head>),
  ומלאו את הטקסטים שמסומנים ב-[ ] בהתאם לתוכן האמיתי של האתר.

  שימו לב לשתי נקודות קריטיות עבור אתר בעברית:
  1. lang="he"  — מצהיר שהשפה עברית (חשוב לגוגל ולנגישות).
  2. dir="rtl"  — כיוון כתיבה מימין לשמאל.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== SEO ראשי ===== -->
    <!-- כותרת: 50–60 תווים. זה מה שמופיע ככותרת הכחולה בגוגל. -->
    <title>א. סדצקי הנדסה וייעוץ — שירותי הנדסה וייעוץ מקצועיים</title>

    <!-- תיאור: 150–160 תווים. מופיע מתחת לכותרת בתוצאות החיפוש. -->
    <meta
      name="description"
      content="א. סדצקי הנדסה וייעוץ — שירותי הנדסה וייעוץ הנדסי מקצועיים, בליווי אישי ובאיכות גבוהה. צרו קשר לקבלת פתרון מותאם אישית לפרויקט שלכם."
    />

    <!-- כתובת קנונית — מונעת תוכן כפול -->
    <link rel="canonical" href="https://sade-il.com/" />

    <!-- מאפשר אינדוקס ומעקב אחרי קישורים. ודאו שאין כאן "noindex"! -->
    <meta name="robots" content="index, follow" />

    <!-- ===== Open Graph (שיתוף בפייסבוק / וואטסאפ / לינקדאין) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="א. סדצקי הנדסה וייעוץ" />
    <meta property="og:description" content="שירותי הנדסה וייעוץ הנדסי מקצועיים, בליווי אישי ובאיכות גבוהה." />
    <meta property="og:url" content="https://sade-il.com/" />
    <meta property="og:image" content="https://sade-il.com/og-image.jpg" />
    <meta property="og:locale" content="he_IL" />

    <!-- ===== Twitter / X ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="א. סדצקי הנדסה וייעוץ" />
    <meta name="twitter:description" content="שירותי הנדסה וייעוץ הנדסי מקצועיים, בליווי אישי ובאיכות גבוהה." />
    <meta name="twitter:image" content="https://sade-il.com/og-image.jpg" />

    <!-- ===== נתונים מובנים (Structured Data) — עוזר לגוגל להבין מי אתם ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "א. סדצקי הנדסה וייעוץ",
        "url": "https://sade-il.com",
        "logo": "https://sade-il.com/logo.png",
        "description": "שירותי הנדסה וייעוץ הנדסי מקצועיים, בליווי אישי ובאיכות גבוהה.",
        "areaServed": "IL",
        "knowsLanguage": "he"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- נקודת הכניסה של Vite — אל תשנו את הנתיב אם הפרויקט שלכם משתמש בנתיב אחר -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
